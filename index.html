<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KnockBoard">
<title>KnockBoard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Change --a to your logo color */
:root{--a:#ff6a00;--bg:#000;--c:#0d0d0d;--b:#262626;--t:#f2f2f2;--m:#8d8d8d;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0;letter-spacing:-.3px}h1 span{color:var(--a)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--t);background:#000;border:1px solid var(--b);border-radius:10px;padding:10px}
textarea{min-height:64px}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
button,.btn{font:inherit;font-size:14px;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 13px;text-decoration:none;display:inline-block}
.pri{background:var(--a);border-color:var(--a);color:#000;font-weight:700}
.row{display:flex;gap:8px}.row>div{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border-radius:99px;padding:6px 13px;font-size:13px}.chip.on{background:var(--a);border-color:var(--a);color:#000;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .chip{flex:1;text-align:center;padding:9px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.st{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:20px}.st span{color:var(--m);font-size:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:600}.sub{color:var(--m);font-size:13px}
.badge{font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid var(--a);color:var(--a);height:fit-content;white-space:nowrap}
.due{color:#ff5c5c;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:13px 20px;box-shadow:0 4px 18px #000}
dialog{border:1px solid var(--b);border-radius:16px;padding:16px;width:min(94vw,520px);background:#0a0a0a;color:var(--t)}
dialog::backdrop{background:#000b}
.empty{text-align:center;color:var(--m);padding:30px 10px}
#map{height:58vh;min-height:320px;border-radius:12px;border:1px solid var(--b)}
.kbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
#kstats{grid-template-columns:repeat(5,1fr);gap:6px}#kstats .st{padding:8px 4px;text-align:center}
.kb{padding:16px 6px;font-weight:700;color:#fff;border:none;border-radius:12px}
#auth,#pay{max-width:380px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 20px}
#auth h1,#pay h1{font-size:34px;margin-bottom:6px}
#amsg{color:#ff7b7b;min-height:20px;font-size:13px;margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="auth" hidden>
  <h1>Knock<span>Board</span></h1>
  <div class="sub" style="margin-bottom:22px">Track every door. Close more sales.</div>
  <label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div id="amsg"></div>
  <div class="row"><button class="pri" id="login">Log in</button><button id="signup">Create account</button></div>
</div>

<div id="pay" hidden>
  <h1>Knock<span>Board</span></h1>
  <div class="sub" style="margin-bottom:22px">Start your 7-day free trial. Then $29/month. Cancel anytime.</div>
  <div id="paymsg" style="color:#ffb26b;margin-bottom:12px"></div>
  <button class="pri" id="paygo" style="width:100%;padding:14px">Start free trial</button>
  <div class="row" style="margin-top:10px"><button id="payref">I've subscribed, refresh</button><button id="payout">Log out</button></div>
</div>

<div id="app" hidden>
<div class="wrap">
  <div class="bar"><h1>Knock<span>Board</span></h1><button id="out">Log out</button></div>
  <div class="tabs"><button class="chip on" data-tab="C">Customers</button><button class="chip" data-tab="K">Door knocking</button></div>

  <div id="tabC">
    <div class="stats" id="stats"></div>
    <input id="q" placeholder="Search name, phone, address">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>

  <div id="tabK" hidden>
    <div class="sub" id="kmsg" style="margin-bottom:6px">Tap a house on the map to log it. Your white dot shows where you are.</div>
    <div id="map"></div>
    <div class="row" style="margin-top:8px"><button id="kme" style="flex:1">Find me</button><button id="ksat" style="flex:1">Street view</button></div>
    <div class="stats" id="kstats" style="margin-top:10px"></div>
  </div>
</div>
<button class="btn pri fab" id="add">+ New customer</button>

<datalist id="svcs"></datalist>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:18px">New customer</h2>
  <label>Name</label><input id="f_name">
  <div class="row"><div><label>Phone</label><input id="f_phone" type="tel"></div><div><label>Email</label><input id="f_email" type="email"></div></div>
  <label>Address</label><input id="f_addr">
  <div class="row"><div><label>Service</label><input id="f_svc" list="svcs"></div><div><label>Status</label><select id="f_status"></select></div></div>
  <div class="row"><div><label>Price ($)</label><input id="f_price" type="number" inputmode="decimal"></div><div><label>Source</label><input id="f_src" placeholder="Door knock, referral…"></div></div>
  <div class="row"><div><label>Job date</label><input id="f_job" type="date"></div><div><label>Follow up on</label><input id="f_fu" type="date"></div></div>
  <label>Notes</label><textarea id="f_notes"></textarea>
  <div class="row" style="margin-top:12px;justify-content:space-between"><button id="del" style="color:#ff5c5c;flex:none">Delete</button><span style="text-align:right"><button id="cancel">Cancel</button> <button class="pri" id="save">Save</button></span></div>
</dialog>

<dialog id="pdlg">
  <h2 id="pt" style="margin:0 0 4px;font-size:18px">New house</h2>
  <div class="kbs"><button class="kb" data-r="Sold" style="background:#2f9e44">Sold</button><button class="kb" data-r="Quoted" style="background:#1c7ed6">Quoted/Waiting</button><button class="kb" data-r="Not home" style="background:#f08c00">Not home</button><button class="kb" data-r="No" style="background:#e03131">No</button></div>
  <div id="pform" hidden>
    <label>Name</label><input id="p_name"><label>Phone</label><input id="p_phone" type="tel">
    <div class="row"><div><label>Price ($)</label><input id="p_price" type="number" inputmode="decimal"></div><div><label>Service</label><input id="p_svc" list="svcs"></div></div>
    <div class="row"><div><label id="p_dl">Date</label><input id="p_date" type="date"></div><div><label>Time</label><input id="p_time" type="time"></div></div>
    <button class="pri" id="p_save" style="width:100%;margin-top:10px">Save sale</button>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:12px"><button id="prem" style="color:#ff5c5c;flex:none">Remove pin</button><button id="pclose" style="flex:none">Close</button></div>
</dialog>
</div>

<script>
const sb=supabase.createClient("https://xprdecvflulhmqsgbyya.supabase.co","sb_publishable_TpIXGgnrNHkKhq4GcxvW7w_z9x3AEH5");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+(+n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const today=()=>new Date().toLocaleDateString("en-CA");
const ST=["Lead","Quoted","Scheduled","Done","Paid"],COL={"Sold":"#2f9e44","Quoted":"#1c7ed6","Not home":"#f08c00","No":"#e03131"};
let customers=[],pins=[],filter="All",editId=null,cur=null,map,layer,meMark,mapReady=false,sat=true,base;
$("f_status").innerHTML=ST.map(s=>`<option>${s}</option>`).join("");

/* ---------- Login ---------- */
const amsg=t=>$("amsg").textContent=t;
$("login").onclick=async()=>{amsg("");const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)amsg(error.message)};
$("signup").onclick=async()=>{amsg("");const {data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
  if(error)amsg(error.message);else if(!data.session)amsg("Check your email to confirm your account, then log in.")};
$("out").onclick=()=>sb.auth.signOut();
const PAY="https://buy.stripe.com/test_00weVe8553w83HM7Fc8g000";
let user=null;
async function gate(){
  const {data}=await sb.from("subscriptions").select("status").maybeSingle();
  const ok=!!data&&["active","trialing"].includes(data.status);
  $("auth").hidden=true;$("pay").hidden=ok;$("app").hidden=!ok;
  if(ok)loadAll();else $("paymsg").textContent=data?"Your subscription isn't active. Start a new one to keep using KnockBoard.":"";
}
sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;
  if(user)setTimeout(gate,0);
  else{$("auth").hidden=false;$("pay").hidden=true;$("app").hidden=true;customers=[];pins=[];if(mapReady)drawPins()}});
$("paygo").onclick=()=>{location.href=PAY+"?client_reference_id="+encodeURIComponent(user.id)+"&prefilled_email="+encodeURIComponent(user.email)};
$("payref").onclick=gate;
$("payout").onclick=()=>sb.auth.signOut();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&user&&!$("pay").hidden)gate()});

async function loadAll(){
  const [c,p]=await Promise.all([sb.from("customers").select("*").order("created_at",{ascending:false}),sb.from("pins").select("*")]);
  customers=c.data||[];pins=p.data||[];
  $("svcs").innerHTML=[...new Set([...customers,...pins].map(r=>r.service).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join("");
  render();drawPins();
}

/* ---------- Customers ---------- */
function render(){
  const q=$("q").value.toLowerCase().trim(),open=customers.filter(r=>["Lead","Quoted"].includes(r.status)),
    due=customers.filter(r=>r.follow_up&&r.follow_up<=today()&&!["Paid","Done"].includes(r.status));
  $("stats").innerHTML=
   `<div class="st"><b>${open.length}</b><span>Open leads & quotes</span></div>
    <div class="st"><b>${money(open.reduce((a,r)=>a+(+r.price||0),0))}</b><span>Quoted pipeline</span></div>
    <div class="st"><b>${due.length}</b><span>Follow-ups due</span></div>
    <div class="st"><b>${money(customers.filter(r=>r.status==="Paid").reduce((a,r)=>a+(+r.price||0),0))}</b><span>Paid revenue</span></div>`;
  $("chips").innerHTML=["All",...ST].map(s=>`<button class="chip ${s===filter?"on":""}" data-s="${s}">${s}${s==="All"?"":" ("+customers.filter(r=>r.status===s).length+")"}</button>`).join("");
  const list=customers.filter(r=>(filter==="All"||r.status===filter)&&(!q||[r.name,r.phone,r.address,r.email].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a.follow_up||"9999").localeCompare(b.follow_up||"9999"));
  $("list").innerHTML=list.length?list.map(r=>{
    const ph=(r.phone||"").replace(/[^\d+]/g,""),late=r.follow_up&&r.follow_up<=today()&&!["Paid","Done"].includes(r.status),next=ST[ST.indexOf(r.status)+1];
    return `<div class="card"><div class="top"><div><div class="nm">${esc(r.name)}</div>
      <div class="sub">${esc(r.service)}${r.price?" · "+money(r.price):""}</div>
      ${r.address?`<div class="sub">${esc(r.address)}</div>`:""}
      ${r.job_date?`<div class="sub">Job: ${esc(r.job_date)}</div>`:""}
      ${r.follow_up?`<div class="sub ${late?"due":""}">Follow up: ${esc(r.follow_up)}</div>`:""}
      ${r.notes?`<div class="sub">${esc(r.notes)}</div>`:""}</div><span class="badge">${esc(r.status)}</span></div>
      <div class="acts">${ph?`<a class="btn" href="tel:${ph}">Call</a><a class="btn" href="sms:${ph}">Text</a>`:""}
      ${r.address?`<a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${encodeURIComponent(r.address)}">Directions</a>`:""}
      ${next?`<button data-adv="${r.id}">Move to ${next}</button>`:""}<button data-edit="${r.id}">Edit</button></div></div>`}).join("")
    :`<div class="empty">No customers yet. Tap “+ New customer” or log a sale on the map.</div>`;
}
function openForm(r){
  editId=r?r.id:null;r=r||{};$("dt").textContent=r.id?"Edit customer":"New customer";
  const m={f_name:"name",f_phone:"phone",f_email:"email",f_addr:"address",f_svc:"service",f_price:"price",f_src:"source",f_job:"job_date",f_fu:"follow_up",f_notes:"notes"};
  for(const k in m)$(k).value=r[m[k]]||"";
  $("f_status").value=r.status||"Lead";$("del").style.display=r.id?"":"none";$("dlg").showModal();
}
$("add").onclick=()=>openForm();
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
  const name=$("f_name").value.trim();if(!name){$("f_name").focus();return}
  const d={name,phone:$("f_phone").value.trim(),email:$("f_email").value.trim(),address:$("f_addr").value.trim(),service:$("f_svc").value.trim(),
    status:$("f_status").value,price:+$("f_price").value||0,source:$("f_src").value.trim(),job_date:$("f_job").value||null,follow_up:$("f_fu").value||null,notes:$("f_notes").value.trim()};
  const r=editId?await sb.from("customers").update(d).eq("id",editId):await sb.from("customers").insert(d);
  if(r.error){alert(r.error.message);return}$("dlg").close();loadAll();
};
$("del").onclick=async()=>{if(editId&&confirm("Delete this customer?")){await sb.from("customers").delete().eq("id",editId);$("dlg").close();loadAll()}};
$("q").oninput=render;
$("chips").onclick=e=>{const s=e.target.dataset.s;if(s){filter=s;render()}};
$("list").onclick=async e=>{
  const ed=e.target.dataset.edit,adv=e.target.dataset.adv;
  if(ed)openForm(customers.find(r=>r.id===ed));
  if(adv){const r=customers.find(r=>r.id===adv);await sb.from("customers").update({status:ST[ST.indexOf(r.status)+1]}).eq("id",adv);loadAll()}
};

/* ---------- Door knocking map ---------- */
const SAT="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",STR="https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png";
function initMap(){
  if(mapReady){map.invalidateSize();return}mapReady=true;
  map=L.map("map",{zoomControl:false}).setView([39.5,-98.35],4);
  base=L.tileLayer(SAT,{maxZoom:19,attribution:"Esri"}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on("click",e=>openPin({lat:e.latlng.lat,lng:e.latlng.lng}));
  if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(!meMark){meMark=L.circleMarker(ll,{radius:8,color:"#ff6a00",weight:4,fillColor:"#fff",fillOpacity:1}).addTo(map);map.setView(ll,18)}else meMark.setLatLng(ll)},
    ()=>$("kmsg").textContent="Allow location for this site to see your white dot.",{enableHighAccuracy:true,maximumAge:2000});
  drawPins();
}
function drawPins(){
  if(!mapReady)return;layer.clearLayers();
  pins.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:10,color:"#fff",weight:2,fillColor:COL[p.result],fillOpacity:1})
    .on("click",e=>{L.DomEvent.stopPropagation(e);openPin(p)}).addTo(layer));
  const c=r=>pins.filter(p=>p.result===r).length;
  $("kstats").innerHTML=["Sold","Quoted","Not home","No"].map(r=>`<div class="st"><b style="color:${COL[r]}">${c(r)}</b><span>${r==="Quoted"?"Quoted/<wbr>Waiting":r}</span></div>`).join("")+`<div class="st"><b>${pins.length}</b><span>Doors</span></div>`;
}
$("kme").onclick=()=>{if(meMark)map.setView(meMark.getLatLng(),18);else $("kmsg").textContent="Waiting for your location…"};
$("ksat").onclick=()=>{sat=!sat;map.removeLayer(base);base=L.tileLayer(sat?SAT:STR,{maxZoom:19,attribution:sat?"Esri":"CARTO"}).addTo(map);base.bringToBack();$("ksat").textContent=sat?"Street view":"Satellite"};

function setF(r){$("p_save").textContent=r==="Quoted"?"Save quote":"Save sale";$("p_dl").textContent=r==="Quoted"?"Follow-up date":"Date"}
function openPin(p){
  cur=p;const d=p.visit_at?new Date(p.visit_at):null;
  $("pt").textContent=p.id?"Update this house":"New house";
  $("p_name").value=p.name||"";$("p_phone").value=p.phone||"";$("p_price").value=p.price||"";$("p_svc").value=p.service||"";
  $("p_date").value=d?d.toLocaleDateString("en-CA"):"";$("p_time").value=d?d.toTimeString().slice(0,5):"";
  $("pform").hidden=!["Sold","Quoted"].includes(p.result);setF(p.result);$("prem").hidden=!p.id;$("pdlg").showModal();
}
async function savePin({dt,tm,...o}){
  const row={lat:cur.lat,lng:cur.lng,...o};
  const r=cur.id?await sb.from("pins").update(row).eq("id",cur.id):await sb.from("pins").insert(row);
  if(r.error){alert(r.error.message);return}
  if((o.result==="Sold"||o.result==="Quoted")&&o.name){
    const q=o.result==="Quoted",ex=customers.find(c=>c.name===o.name&&(c.phone||"")===(o.phone||"")),
      d={name:o.name,phone:o.phone,service:o.service,status:q?"Quoted":"Scheduled",price:o.price||0,source:"Door knock",job_date:q?null:(dt||null),follow_up:q?(dt||null):null,notes:tm?"Time: "+tm:null};
    if(!ex)await sb.from("customers").insert(d);
    else if(!q&&["Lead","Quoted"].includes(ex.status))await sb.from("customers").update({status:"Scheduled",price:d.price,job_date:d.job_date,service:d.service}).eq("id",ex.id);
  }
  $("pdlg").close();loadAll();
}
document.querySelectorAll("#pdlg .kb").forEach(b=>b.onclick=()=>{
  const r=b.dataset.r;if(r==="Sold"||r==="Quoted"){cur={...cur,result:r};$("pform").hidden=false;setF(r)}else savePin({result:r})});
$("p_save").onclick=()=>{const d=$("p_date").value,t=$("p_time").value;
  savePin({result:cur.result,name:$("p_name").value.trim(),phone:$("p_phone").value.trim(),price:+$("p_price").value||0,service:$("p_svc").value.trim(),
    visit_at:d?new Date(d+"T"+(t||"09:00")).toISOString():null,dt:d,tm:t})};
$("prem").onclick=async()=>{if(cur.id){await sb.from("pins").delete().eq("id",cur.id);$("pdlg").close();loadAll()}};
$("pclose").onclick=()=>$("pdlg").close();

document.querySelector(".tabs").onclick=e=>{
  const t=e.target.dataset.tab;if(!t)return;
  document.querySelectorAll(".tabs .chip").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("tabC").hidden=t!=="C";$("tabK").hidden=t!=="K";$("add").hidden=t!=="C";
  if(t==="K")initMap();
};
</script>
</body>
</html>
