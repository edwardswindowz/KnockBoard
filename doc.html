<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Quote or invoice</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#0b1220;--m:#5d6679;--l:#e3e8f0;--a:#2b7fff;--ok:#1f9d55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:18px 16px 60px}
.w{max-width:560px;margin:0 auto}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 6px 24px #0b122010}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:700}
h1{font-size:26px;margin:2px 0 2px;letter-spacing:-.5px}.sub{color:var(--m);font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--l)}.row:last-child{border:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-size:20px;font-weight:800}.tot span:last-child{font-size:30px;letter-spacing:-1px}
label{display:block;font-size:13px;font-weight:700;color:var(--m);margin:12px 0 5px}
input[type=text]{width:100%;padding:14px;border:1.5px solid #c9d2e0;border-radius:12px;font-size:20px;font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;background:#fff;color:var(--t)}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--t)}.agree input{width:22px;height:22px;margin-top:1px;flex:none}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;margin-top:14px;cursor:pointer;color:#fff;background:var(--a)}
.btn[disabled]{opacity:.45;cursor:default}.btn.sq{background:#0b1220}.btn.cash{background:#00c244}.btn.venmo{background:#3d95ce}.zelle{margin-top:16px;padding:14px;border:1.5px solid #c9d2e0;border-radius:14px}.zv{font-size:20px;font-weight:800;margin:6px 0;word-break:break-all}.btn.zc{background:#6d1ed4;margin-top:8px;padding:13px}.btn.ok{background:var(--ok)}
.ok-box{background:#e8f8ee;border:1px solid #b6e6c7;color:#14532d;border-radius:14px;padding:16px;font-weight:600}
.err{background:#fff1f0;border:1px solid #ffc9c4;color:#8a1c12;border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.ft{text-align:center;color:var(--m);font-size:12px;margin-top:22px}.ft a{color:var(--m)}
</style></head><body><div class="w" id="app"></div>
<script>
const SB="https://xprdecvflulhmqsgbyya.supabase.co",KEY="sb_publishable_TpIXGgnrNHkKhq4GcxvW7w_z9x3AEH5";
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(+n||0).toLocaleString(undefined,{minimumFractionDigits:(+n%1?2:0),maximumFractionDigits:2});
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";
let P=null;
function fromHash(){try{let h=location.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";const bin=atob(h),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(by))}catch(e){return null}}
async function load(){
  const id=new URLSearchParams(location.search).get("d");
  if(id){try{const r=await fetch(SB+"/rest/v1/rpc/get_doc",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})});if(r.ok){const j=await r.json();if(j&&j.it)return j}}catch(e){}}
  return fromHash();
}
const fmtDate=d=>{try{const[a,b,c]=d.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}catch(e){return d||""}};
const fmtT=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
load().then(p=>{P=p;if(!P||!P.it){app.innerHTML='<div class="card"><h1>This link is not valid</h1><p class="sub">Ask the business to send it again.</p></div>'}
else{
  const q=P.k==="q";document.title=(q?"Quote ":"Invoice ")+P.n+" from "+P.b;
  const items=P.it.map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${money(x[1])}</b></div>`).join("");
  const when=P.jd?`<div class="row"><span class="sub">Scheduled</span><span>${esc(fmtDate(P.jd))}${P.tm?" at "+esc(fmtT(P.tm)):""}</span></div>`:"";
  const plan=P.pl&&P.pp?`<div class="row"><span class="sub">Then ${esc(P.pl)} service</span><b>${money(P.pp)} / visit</b></div>`:"";
  const contact=[P.bp&&`<a href="tel:${esc(P.bp)}">${esc(P.bp)}</a>`,P.be&&`<a href="mailto:${esc(P.be)}">${esc(P.be)}</a>`].filter(Boolean).join(" · ");
  let h=`<div class="card"><div class="k">${q?"Quote":"Invoice"} ${esc(P.n)}</div><h1>${esc(P.b)}</h1><div class="sub">${esc(fmtDate(P.d))}${contact?" · "+contact:""}</div></div>
  <div class="card"><div class="k">Prepared for</div><div style="font-weight:700;font-size:18px">${esc(P.c)}</div>${P.a?`<div class="sub">${esc(P.a)}</div>`:""}
  <div style="margin-top:12px">${items}${when}${plan}</div><div class="tot"><span>${q?"Total":"Amount due"}</span><span>${money(P.t)}</span></div></div>`;
  if(q){
    const key="kbsig_"+P.n,done=lsGet(key);
    h+=`<div class="card" id="signbox">${done?`<div class="ok-box">You accepted this quote on ${esc(done.on)} as ${esc(done.name)}. Thank you!</div>`:`
      <div class="k">Accept this quote</div>
      <label for="nm">Type your full name to sign</label><input type="text" id="nm" autocomplete="name" placeholder="Your full name">
      <label class="agree"><input type="checkbox" id="ag"><span>I accept this quote for ${money(P.t)} and authorize ${esc(P.b)} to do the work described above. Typing my name is my electronic signature.</span></label>
      <button class="btn ok" id="go" disabled>Accept &amp; sign</button><div id="msg"></div>`}</div>`;
  }else{
    const sq=safeUrl(P.sq),st=safeUrl(P.st),cs=String(P.cs||"").replace(/[^A-Za-z0-9_.-]/g,""),vm=String(P.vm||"").replace(/[^A-Za-z0-9_.-]/g,""),zl=String(P.zl||"").slice(0,80),amt=(+P.t||0).toFixed(2).replace(/\.00$/,""),any=sq||st||cs||vm||zl;
    h+=`<div class="card"><div class="k">Pay online</div><div style="margin:10px 0 0;font-size:34px;font-weight:900;letter-spacing:-.5px">${money(P.t)}</div><div class="sub" style="margin:2px 0 0">Amount due</div>${sq||st?`<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff4d6;color:#6b4a00;font-weight:700;font-size:15px;line-height:1.4">When the payment page asks for an amount, enter exactly ${money(P.t)}.</div>`:""}
      ${st?`<a class="btn" href="${esc(st)}" rel="noopener">Pay ${money(P.t)} by card</a>`:""}
      ${sq?`<a class="btn sq" href="${esc(sq)}" rel="noopener">Pay ${money(P.t)} with Square</a>`:""}
      ${cs?`<a class="btn cash" href="https://cash.app/$${esc(cs)}/${esc(amt)}" rel="noopener">Pay ${money(P.t)} with Cash App</a>`:""}
      ${vm?`<a class="btn venmo" href="https://venmo.com/${esc(vm)}?txn=pay&amp;amount=${esc(amt)}&amp;note=${encodeURIComponent("Invoice "+P.n)}" rel="noopener">Pay ${money(P.t)} with Venmo</a>`:""}
      ${zl?`<div class="zelle"><b>Pay with Zelle</b><div class="sub">Open your bank app, tap Zelle, and send ${money(P.t)} to:</div><div class="zv" id="zv">${esc(zl)}</div><button class="btn zc" id="zc" type="button">Copy Zelle info</button></div>`:""}
      ${!any?`<p>To pay, contact ${esc(P.b)}${contact?": "+contact:""}.</p>`:""}
      ${P.pn?`<p class="sub" style="margin-top:14px">${esc(P.pn)}</p>`:""}</div>`;
  }
  h+=`<div class="ft">Sent with <a href="https://knockboard.org">KnockBoard</a></div>`;
  app.innerHTML=h;
  if($("zc"))$("zc").onclick=async()=>{const t=$("zv").textContent;try{await navigator.clipboard.writeText(t);$("zc").textContent="Copied!"}catch(e){$("zc").textContent="Long-press the number above to copy"}};
  if(q&&!$("go")===false){
    const nm=$("nm"),ag=$("ag"),go=$("go"),msg=$("msg"),upd=()=>go.disabled=!(nm.value.trim().length>=2&&ag.checked);nm.oninput=upd;ag.onchange=upd;
    go.onclick=async()=>{
      go.disabled=true;go.textContent="Signing…";msg.innerHTML="";
      const name=nm.value.trim(),id=(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=="x"?r:r&3|8).toString(16)}));
      let ok=false;
      try{
        const r=await fetch(SB+"/rest/v1/quote_signs",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id,owner:P.u,cid:P.cid,doc_no:P.n,name,total:P.t,ua:navigator.userAgent.slice(0,200)})});
        ok=r.ok;
      }catch(e){}
      if(ok){const on=new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});lsSet("kbsig_"+P.n,{name,on});
        $("signbox").innerHTML=`<div class="ok-box">Thank you, ${esc(name)}! Your acceptance was sent to ${esc(P.b)}.</div>`}
      else{
        const txt="I accept quote "+P.n+" for "+money(P.t)+". Signed: "+name;
        msg.innerHTML=`<div class="err">We couldn't send your signature automatically.${P.bp?` Tap below to text it to ${esc(P.b)} instead.`:" Please contact "+esc(P.b)+" to confirm."}</div>${P.bp?`<a class="btn" href="sms:${esc(P.bp)}?&body=${encodeURIComponent(txt)}">Text my acceptance</a>`:""}`;
        go.textContent="Try again";go.disabled=false}
    };
  }
}
});
</script></body></html>
